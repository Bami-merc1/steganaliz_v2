name: Keep Render alive

on:
  schedule:
    # Every 14 minutes — just under Render's 15-min spin-down threshold
    - cron: '*/14 * * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render API health endpoint
        run: |
          echo "Pinging Steganaliz API at $(date)"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 https://steganaliz-v2.onrender.com/health)
          echo "Response status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Server is awake"
          else
            echo "⚠️ Server returned $STATUS — may still be waking up"
          fi